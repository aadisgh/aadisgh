name: Update GitHub Profile Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate activity card
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: activity
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Generate signal card
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: signal
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - name: Generate language card
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: languages
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      - name: Publish generated cards
        env:
          ACTIVITY_DIR: ${{ steps.activity.outputs.ready-dir }}
          SIGNAL_DIR: ${{ steps.signal.outputs.ready-dir }}
          LANG_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$ACTIVITY_DIR"/activity-consistency-*.svg profile/
          cp "$SIGNAL_DIR"/signal-field-*.svg profile/
          cp "$LANG_DIR"/language-composition-*.svg profile/

          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/signal-field-wide-dark.svg
          test -s profile/language-composition-wide-dark.svg

          git add profile/*.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub profile cards"
          git push
